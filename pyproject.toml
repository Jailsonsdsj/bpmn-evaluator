[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpmn-hybrid-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25",
    "pymupdf>=1.24",
    "python-dotenv",
    "structlog",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["agents"]
